name: Actualizar indicadores y publicar sitio

on:
  schedule:
    - cron: "0 13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Actualizar UF y UTM
        run: node scripts/actualizar-indicadores.mjs
      - name: Guardar cambios
        run: |
          git config user.name "Let Global bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/indicadores.json
          git diff --cached --quiet || (git commit -m "Actualiza UF y UTM" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
